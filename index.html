<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>梟の研究所</title>
    <style>
        div.bg {
            background-color: #fffdfd61;
            border: 2px solid #000;
            margin-right: 10px;
            margin-left: 10px;
            width: 50%;
        }
        
        </style>
    <!-- <link rel="stylesheet" href="css/LGN/lgin.css" /> -->
</head>
<body>
    <div class="bg">
    <h1>梟の研究所へようこそ</h1>
    <h4>初期画面。作成中</h4>
    <p>なんとなくで制作ちゅう...どうやら無事反映されているようだ</p>
    <h5>やりたいこと</h5>
    <ul>
        <li>研究所の紹介ページを作成する</li>
        <li>研究内容を掲載する</li>
        <li>最新ニュースを更新する</li>
    </ul>
    <h5>現在</h5>
    <ul>
        <li>研究内容の「要件定義」を作成中</li>
        <li>ページ全体の自動更新ができているかの確認(10分毎→30分毎に変更)
            <ul>
                <li>確認2-確認完了</li>
            </ul>
        </li>
        <li>
            <div id="stream-status">
            配信状況：自動更新ができているかの確認(10分毎)
            </div>
        </li>
    </ul>
    </div>
    <!-- <div class="overlay">
        <div class="content">
            <h1>OWL RESEARCH INSTITUTE</h1>
            <button onclick="goHome()">研究所に入場する</button>
        </div>
    </div> 

    <script src="js/LGN/lgin.js"></script> -->
    <script>
    // ==================================
// ページ全体を30分ごとに更新
// ==================================
setInterval(() => {
    location.reload();
}, 30 * 60 * 1000);


// ==================================
// 配信状況を10分ごとに部分更新
// ==================================
async function updateStreamStatus() {
    try {
        const response = await fetch("data/status.txt", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("配信状況の取得に失敗しました");
        }

        const status = await response.text();

        document.getElementById("stream-status").textContent = status;

    } catch (error) {
        console.error(error);
    }
}

// 初回実行
updateStreamStatus();

// 10分ごとに更新
setInterval(updateStreamStatus, 10 * 60 * 1000);
</script>
</body>
</html>
